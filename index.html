<body>
<style>
@font-face { font-family: "Cinzel"; src: url(fonts/cinzel.woff2) format("woff2"); font-weight: 400 900; font-display: swap; }
@font-face { font-family: "Outfit"; src: url(fonts/outfit.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jbmono.woff2) format("woff2"); font-weight: 100 800; font-display: swap; }
</style>
<style>
/* Layout: a single-column imperial war council. Dark by design: ink-navy field, gold leaf, imperial crimson.
   Cabinet ledger on top, reels and trading cards in the middle, fixed tab bar below. */
:root {
  --ink: #0A0F1D;
  --ink-2: #111829;
  --ink-3: #19223A;
  --gold: #E3C06F;
  --gold-deep: #A87E34;
  --crimson: #D8434B;
  --parch: #EEE7D7;
  --muted: #98A1B6;
  --line: rgba(227, 192, 111, .16);
  --line-2: rgba(238, 231, 215, .09);
  --epic: #B38CF7;
  --rare: #62A8F2;
  --common: #8E97AA;
  --good: #5CC98E;
  --display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --body: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--parch); font: 400 16px/1.45 var(--body);
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(216, 67, 75, .16), transparent 60%),
    radial-gradient(90% 50% at 100% 110%, rgba(227, 192, 111, .08), transparent 60%),
    var(--ink);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none;
  -webkit-user-select: none; user-select: none;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; background: none; border: 0; padding: 0; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
textarea { -webkit-user-select: text; user-select: text; }
.wrap { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 12px; gap: 12px; }
.brand { display: grid; gap: 2px; }
.brand .mark { font: 900 30px/1 var(--display); letter-spacing: .04em; background: linear-gradient(180deg, #F8E3A8 0%, var(--gold) 45%, var(--gold-deep) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .mark i { font-style: normal; color: var(--crimson); -webkit-text-fill-color: var(--crimson); }
.brand small { font: 500 10.5px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; background: rgba(255,255,255,.03); }
.icon-btn svg { width: 19px; height: 19px; stroke: var(--gold); fill: none; stroke-width: 1.8; }

/* ---------- Tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding-bottom: env(safe-area-inset-bottom, 0px);
  background: linear-gradient(180deg, rgba(10,15,29,.72), rgba(10,15,29,.96)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs-in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { padding: 10px 2px 12px; display: grid; justify-items: center; gap: 4px; color: var(--muted); font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; position: relative; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.tab[aria-selected="true"] { color: var(--gold); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px; background: var(--gold); border-radius: 2px; box-shadow: 0 0 12px var(--gold); }

/* ---------- Type & primitives ---------- */
h1, h2, h3 { font-family: var(--display); margin: 0; font-weight: 700; text-wrap: balance; letter-spacing: .02em; }
h2 { font-size: 27px; line-height: 1.08; }
h3 { font-size: 19px; line-height: 1.15; }
p { margin: 0; }
.eyebrow { font: 500 10.5px/1.2 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); opacity: .85; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 16px; }
.stack-s { display: grid; gap: 10px; }
.panel { position: relative; border-radius: 18px; padding: 18px; background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015)); border: 1px solid var(--line); }
.rule { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); border: 0; margin: 0; }
.btn { width: 100%; border-radius: 14px; padding: 16px 18px; font: 700 15px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: #22170A;
  background: linear-gradient(180deg, #F6DE9C, var(--gold) 55%, #C89B4A); box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 10px 30px -12px rgba(227,192,111,.55); transition: transform .14s cubic-bezier(.2,.8,.2,1), filter .14s; }
.btn:active { transform: scale(.97); filter: brightness(.95); }
.btn.red { color: #FFF3F1; background: linear-gradient(180deg, #EE6068, var(--crimson) 60%, #AE2F37); box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 10px 30px -12px rgba(216,67,75,.7); }
.btn.ghost { color: var(--parch); background: rgba(255,255,255,.04); box-shadow: none; border: 1px solid var(--line); }
.btn:disabled { opacity: .35; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 130px; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 4px; padding: 8px 0; font-size: 14px; justify-self: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 10px; font: 500 11px/1 var(--mono); letter-spacing: .06em; border: 1px solid var(--line-2); color: var(--parch); background: rgba(255,255,255,.04); white-space: nowrap; }
.chip.good { color: var(--good); border-color: rgba(92,201,142,.35); background: rgba(92,201,142,.08); }
.chip.bad { color: #FF8D93; border-color: rgba(216,67,75,.45); background: rgba(216,67,75,.1); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Mode cards (home) ---------- */
.hero { padding: 22px 18px; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(227,192,111,.18), transparent 70%); pointer-events: none; }
.hero h2 { font-size: 31px; }
.modes { display: grid; gap: 10px; }
.mode { text-align: left; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.03); transition: transform .14s cubic-bezier(.2,.8,.2,1), border-color .2s; }
.mode:active { transform: scale(.98); }
.mode .glyph { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, rgba(227,192,111,.35), rgba(227,192,111,.06)); border: 1px solid var(--line); }
.mode .glyph svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.7; }
.mode b { font: 700 17px/1.1 var(--display); letter-spacing: .04em; display: block; }
.mode span.d { font-size: 13px; color: var(--muted); }
.mode .go { color: var(--gold); font-size: 22px; }

/* ---------- Cabinet ledger ---------- */
.ledger { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.seat { position: relative; min-width: 0; border-radius: 12px; padding: 8px 6px 9px; display: grid; justify-items: center; gap: 5px; text-align: center; border: 1px dashed rgba(238,231,215,.16); background: rgba(255,255,255,.02); min-height: 96px; }
.seat.filled { border: 1px solid var(--line); background: linear-gradient(180deg, rgba(227,192,111,.10), rgba(255,255,255,.02)); }
.seat.fresh { animation: seatIn .6s cubic-bezier(.2,.9,.25,1.2); }
@keyframes seatIn { 0% { transform: scale(.7); opacity: 0; } 100% { transform: none; opacity: 1; } }
.seat .r { font: 500 8.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.seat .n { font: 600 11px/1.15 var(--body); overflow-wrap: break-word; hyphens: auto; }
.seat .v { color: var(--muted); font-size: 11px; }
.seat .empty-medal { width: 38px; height: 38px; border-radius: 50%; border: 1px dashed rgba(238,231,215,.2); display: grid; place-items: center; color: rgba(238,231,215,.25); font: 700 14px var(--display); }

/* ---------- Medallion portrait ---------- */
.medal { --rc: var(--common); position: relative; flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(from 210deg, var(--rc), rgba(255,255,255,.15), var(--rc), rgba(0,0,0,.2), var(--rc)); padding: 2px; }
.medal .face { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font: 700 19px/1 var(--display); letter-spacing: .02em; color: var(--parch);
  background: radial-gradient(circle at 35% 28%, hsl(var(--hue) 45% 38%), hsl(var(--hue) 50% 14%) 75%); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 -8px 14px rgba(0,0,0,.35); text-shadow: 0 1px 0 rgba(0,0,0,.5); }
.medal .fl { position: absolute; right: -3px; bottom: -3px; font-size: 16px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
.medal.s { width: 38px; height: 38px; } .medal.s .face { font-size: 13px; } .medal.s .fl { font-size: 12px; right: -4px; bottom: -4px; }
.medal.l { width: 96px; height: 96px; padding: 3px; } .medal.l .face { font-size: 34px; } .medal.l .fl { font-size: 24px; }
.medal.leg { --rc: var(--gold); box-shadow: 0 0 22px -4px rgba(227,192,111,.7); }
.medal.epic { --rc: var(--epic); } .medal.rare { --rc: var(--rare); }

.rar { font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; border: 1px solid currentColor; }
.rar.leg { color: var(--gold); } .rar.epic { color: var(--epic); } .rar.rare { color: var(--rare); } .rar.common { color: var(--common); }

/* ---------- Draft: reels ---------- */
.roundbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pips { display: flex; gap: 5px; }
.pip { width: 22px; height: 4px; border-radius: 2px; background: rgba(238,231,215,.14); }
.pip.on { background: var(--gold); } .pip.now { background: var(--crimson); box-shadow: 0 0 10px var(--crimson); }
.reels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reel { position: relative; overflow: hidden; border-radius: 16px; padding: 12px 12px 10px; min-width: 0; display: grid; gap: 8px; align-content: start;
  background: linear-gradient(180deg, #121A2E, #0C1222); border: 1px solid var(--line); box-shadow: inset 0 12px 20px -14px rgba(0,0,0,.8), inset 0 -12px 20px -14px rgba(0,0,0,.8); }
.reel .win { height: 52px; overflow: hidden; position: relative; }
.reel .val { font: 700 20px/1.1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; min-height: 52px; overflow-wrap: anywhere; }
.reel .val .fl { font-size: 26px; }
.reel.spinning .val { animation: reelBlur .09s linear infinite; }
@keyframes reelBlur { 0% { transform: translateY(-40%); opacity: .3; filter: blur(2px); } 100% { transform: translateY(40%); opacity: .3; filter: blur(2px); } }
.reel.landed .val { animation: land .45s cubic-bezier(.2,.9,.25,1.25); }
@keyframes land { 0% { transform: translateY(-60%); opacity: .2; } 100% { transform: none; opacity: 1; } }
.respin { justify-self: start; display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.respin svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.4; }
.respin:disabled { opacity: .3; }

/* ---------- Candidate cards ---------- */
.cands { display: grid; gap: 10px; }
.card { position: relative; overflow: hidden; text-align: left; width: 100%; display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 18px;
  background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.015)); border: 1px solid var(--line-2); transition: transform .16s cubic-bezier(.2,.8,.2,1), border-color .2s; opacity: 0; animation: deal .5s cubic-bezier(.2,.9,.25,1.1) forwards; }
.card:active { transform: scale(.975); }
@keyframes deal { 0% { opacity: 0; transform: translateY(18px) rotateX(35deg); } 100% { opacity: 1; transform: none; } }
.card.leg { border-color: rgba(227,192,111,.5); }
.card.leg::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,235,170,.18) 45%, rgba(255,255,255,.28) 50%, rgba(255,235,170,.18) 55%, transparent 70%); background-size: 250% 100%; animation: foil 3.2s ease-in-out infinite; mix-blend-mode: screen; }
@keyframes foil { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }
.card.epic { border-color: rgba(179,140,247,.4); } .card.rare { border-color: rgba(98,168,242,.3); }
.card .nm { font: 600 18px/1.15 var(--body); display: block; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.spark5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 9px; }
.spark5 i { height: 4px; border-radius: 2px; background: rgba(238,231,215,.1); position: relative; overflow: hidden; }
.spark5 i b { position: absolute; inset: 0; right: auto; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: 2px; }
.card .blind { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--muted); margin-top: 8px; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(3,5,12,.66); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .2s ease; }
.sheet { width: 100%; max-width: 540px; max-height: 90%; overflow: auto; border-radius: 26px 26px 0 0; padding: 14px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, #172036, #0E1426 40%); border: 1px solid var(--line); border-bottom: 0; animation: rise .38s cubic-bezier(.2,.9,.25,1); }
.grab { width: 42px; height: 5px; border-radius: 3px; background: rgba(238,231,215,.2); margin: 0 auto 14px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(100%); } }
.bio { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 16px; align-items: center; }
.statlist { display: grid; gap: 9px; }
.stat { display: grid; grid-template-columns: 72px minmax(0,1fr) 22px; gap: 10px; align-items: center; font-size: 13.5px; color: var(--muted); }
.meter { height: 7px; border-radius: 4px; background: rgba(238,231,215,.08); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transform-origin: left; animation: grow .6s cubic-bezier(.2,.9,.25,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.stat .mono { color: var(--parch); text-align: right; }
.seatpick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seatpick button { text-align: left; border-radius: 14px; padding: 12px; display: grid; gap: 4px; border: 1px solid var(--line); background: rgba(255,255,255,.03); transition: transform .14s; }
.seatpick button:active { transform: scale(.97); }
.seatpick button:disabled { opacity: .28; border-style: dashed; }
.seatpick button:last-child:nth-child(odd) { grid-column: span 2; }
.seatpick b { font: 700 14px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.seatpick .fit { font: 500 13px/1 var(--mono); color: var(--gold); letter-spacing: .1em; }
.seatpick .fit .off { color: rgba(238,231,215,.18); }
.seatpick span.h { font-size: 12px; color: var(--muted); }
.warn { font-size: 12.5px; }

/* ---------- Result / war map ---------- */
.mapbox { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 40%, #121B31, #080C18); }
.mapbox canvas { display: block; width: 100%; height: auto; aspect-ratio: 2.35 / 1; max-width: 100%; }
.mapbox .tap { position: absolute; right: 10px; bottom: 8px; font: 500 10px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.recordwrap { display: grid; justify-items: center; text-align: center; gap: 6px; padding-block: 6px 2px; }
.record { font: 900 clamp(64px, 21vw, 104px)/.95 var(--display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.record .w { background: linear-gradient(180deg, #FBE7B0, var(--gold) 50%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.record .d { color: var(--crimson); padding-inline: .06em; }
.record .l { color: rgba(238,231,215,.35); }
.outcome { font: 700 20px/1.1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--parch); }
.outcome.big { animation: stamp .55s cubic-bezier(.2,.9,.25,1.3); }
@keyframes stamp { 0% { transform: scale(2.2); opacity: 0; letter-spacing: .5em; } 100% { transform: none; opacity: 1; } }
.ticker { display: grid; gap: 8px; }
.event { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: start; font-size: 14px; animation: fade .4s ease; }
.event .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--mono); }
.event .ic.ok { background: rgba(92,201,142,.15); color: var(--good); } .event .ic.no { background: rgba(216,67,75,.15); color: #FF8D93; }
.event b { font-weight: 600; }
.grades { display: grid; }
.grade { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line-2); }
.grade:last-child { border-bottom: 0; }
.letter { font: 900 24px/1 var(--display); text-align: center; }
.letter.A { color: var(--gold); text-shadow: 0 0 14px rgba(227,192,111,.5); } .letter.B { color: var(--good); } .letter.C { color: var(--parch); } .letter.D, .letter.F { color: var(--crimson); }
.grade .role { font: 500 9.5px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); opacity: .8; }
.grade .who { font-weight: 600; }
.dispatch { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.dispatch li { position: relative; padding-left: 18px; font-size: 15px; line-height: 1.5; }
.dispatch li::before { content: "✦"; position: absolute; left: 0; top: 0; color: var(--gold); font-size: 11px; line-height: 2; }
.unlock { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(227,192,111,.4); background: linear-gradient(90deg, rgba(227,192,111,.14), transparent); animation: deal .5s cubic-bezier(.2,.9,.25,1.1) both; }

/* ---------- Medals (achievements) ---------- */
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.ach { display: grid; justify-items: center; text-align: center; gap: 6px; padding: 12px 6px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255,255,255,.02); min-width: 0; }
.ach .coin { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: radial-gradient(circle at 35% 30%, #F8E3A8, var(--gold) 45%, var(--gold-deep)); box-shadow: 0 0 18px -6px rgba(227,192,111,.8), inset 0 -3px 6px rgba(0,0,0,.3); color: #3A2708; }
.ach.locked .coin { background: rgba(238,231,215,.06); box-shadow: none; color: rgba(238,231,215,.25); }
.ach b { font: 600 11.5px/1.2 var(--body); }
.ach span { font-size: 10.5px; color: var(--muted); line-height: 1.25; }
.ach.locked b { color: var(--muted); }

/* ---------- Stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.tile { padding: 12px 10px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255,255,255,.025); min-width: 0; }
.tile b { display: block; font: 700 26px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--parch); }
.tile.hl b { color: var(--gold); }
.tile span { display: block; margin-top: 6px; font: 500 9px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dist { display: grid; gap: 8px; }
.drow { display: grid; grid-template-columns: 132px minmax(0,1fr) 26px; gap: 10px; align-items: center; font-size: 12.5px; }
.dbar { height: 10px; background: rgba(238,231,215,.06); border-radius: 5px; overflow: hidden; }
.dbar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.seg button { padding: 8px 12px; border-radius: 9px; font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--gold); color: #22170A; }
.spark { width: 100%; height: 130px; display: block; }
.favs { display: grid; gap: 8px; }
.fav { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 12px; align-items: center; }

/* ---------- Codex ---------- */
.progress { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 16px; align-items: center; }
.ring { width: 76px; height: 76px; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); font: 500 11px/1 var(--mono); letter-spacing: .06em; color: var(--muted); }
.filters button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(227,192,111,.08); }
.codex { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.cx { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 12px 6px 10px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255,255,255,.025); min-width: 0; }
.cx .nm { font-size: 11.5px; font-weight: 600; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; max-width: 100%; }
.cx.locked .medal { filter: grayscale(1) brightness(.45); }
.cx.locked .nm { color: var(--muted); letter-spacing: .2em; }

/* ---------- History ---------- */
.hist { display: grid; gap: 10px; }
.hitem { border-radius: 16px; border: 1px solid var(--line-2); background: rgba(255,255,255,.025); overflow: hidden; }
.hhead { width: 100%; padding: 14px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; text-align: left; }
.hrec { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 88px; }
.hrec .l { color: rgba(238,231,215,.35); }
.badge { font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.badge.daily { color: var(--crimson); border-color: rgba(216,67,75,.5); } .badge.blind { color: var(--epic); border-color: rgba(179,140,247,.5); }
.hbody { padding: 0 14px 14px; display: grid; gap: 10px; }

/* ---------- Settings, misc ---------- */
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-block: 13px; border-bottom: 1px solid var(--line-2); }
.toggle input { width: 48px; height: 29px; appearance: none; -webkit-appearance: none; border-radius: 15px; position: relative; flex: none; background: rgba(238,231,215,.14); transition: background .2s; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: var(--parch); transition: transform .22s cubic-bezier(.2,.9,.25,1.2); }
.toggle input:checked { background: var(--gold); }
.toggle input:checked::after { transform: translateX(19px); background: #22170A; }
textarea { width: 100%; min-height: 96px; border-radius: 12px; padding: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--parch); font: 12px/1.4 var(--mono); }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; font-weight: 500; font-size: 14px;
  color: #22170A; background: var(--gold); box-shadow: 0 12px 30px -10px rgba(0,0,0,.7); animation: toastIn .3s cubic-bezier(.2,.9,.25,1.2); }
@keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0; } }
.empty { text-align: center; padding: 30px 16px; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.shareimg { width: 100%; max-width: 100%; border-radius: 16px; border: 1px solid var(--line); display: block; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
.privacy { font: 500 10.5px/1.5 var(--mono); letter-spacing: .06em; color: var(--muted); text-align: center; display: flex; gap: 6px; justify-content: center; align-items: center; }
.privacy svg { width: 12px; height: 12px; stroke: var(--good); fill: none; stroke-width: 2; flex: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; } .card { opacity: 1; } }

/* ============================== VIEWS: STATS ============================== */
